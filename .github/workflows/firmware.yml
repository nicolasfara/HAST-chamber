name: Firmware

on:
  workflow_call:
    outputs:
      enabled:
        description: "Whether a Zephyr application exists in firmware/app"
        value: ${{ jobs.zephyr.outputs.enabled }}
  workflow_dispatch:

env:
  BOARD: esp32s3_devkitc/esp32s3/procpu

jobs:
  zephyr:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    defaults:
      run:
        working-directory: firmware
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The firmware is not bootstrapped yet: every following step is skipped until app/CMakeLists.txt exists.
      - name: Detect Zephyr application
        id: detect
        run: |
          if [ -f app/CMakeLists.txt ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "tests=$([ -d app/tests ] && echo true || echo false)" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::notice::firmware/app/CMakeLists.txt not found, skipping firmware build"
          fi
      - name: Setup Python
        if: steps.detect.outputs.enabled == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Setup Zephyr workspace and SDK
        if: steps.detect.outputs.enabled == 'true'
        uses: zephyrproject-rtos/action-zephyr-setup@cc223fe61661d8573c1cd3f95f72f90cce729ae9 # v1.0.16
        with:
          base-path: firmware
          app-path: app
          toolchains: xtensa-espressif_esp32s3_zephyr-elf
          ccache-cache-key: esp32s3
      - name: Fetch Espressif binary blobs
        if: steps.detect.outputs.enabled == 'true'
        run: west blobs fetch hal_espressif
      - name: Build
        if: steps.detect.outputs.enabled == 'true'
        run: west build -b "$BOARD" -d build app
      - name: Tests (native_sim)
        if: steps.detect.outputs.tests == 'true'
        run: west twister -T app/tests -p native_sim --inline-logs
      - name: Collect firmware binaries
        if: steps.detect.outputs.enabled == 'true'
        run: |
          mkdir -p ../dist/firmware
          for ext in bin elf hex; do
            [ -f "build/zephyr/zephyr.$ext" ] && cp "build/zephyr/zephyr.$ext" "../dist/firmware/hast-chamber-esp32s3.$ext"
          done
          ls -la ../dist/firmware
      - name: Upload firmware artifacts
        if: steps.detect.outputs.enabled == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: firmware-artifacts
          path: dist/firmware
          if-no-files-found: error
