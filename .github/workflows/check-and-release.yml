name: Check and Release

on:
  workflow_call:
  workflow_dispatch:

jobs:
  electronics:
    uses: ./.github/workflows/electronics.yml
  firmware:
    uses: ./.github/workflows/firmware.yml
  release:
    name: Release
    needs: [ electronics, firmware ]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download electronics artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: electronics-artifacts
          path: dist/electronics
      - name: Download firmware artifacts
        if: needs.firmware.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firmware-artifacts
          path: dist/firmware
      - name: Package CAD exports
        run: |
          if find cad/exports -type f ! -name .gitkeep | grep -q .; then
            mkdir -p dist/cad
            (cd cad/exports && zip -r ../../dist/cad/cad-exports.zip . -x .gitkeep)
          fi
      - name: Create release tag
        id: create_tag
        run: |
          TAG_NAME="v$(date +'%Y.%m.%d')-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
      - name: Create release with artifacts
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ steps.create_tag.outputs.tag_name }}
          name: Release ${{ steps.create_tag.outputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            dist/electronics/*
            dist/firmware/*
            dist/cad/*
  success:
    runs-on: ubuntu-latest
    needs:
      - electronics
      - firmware
      - release
    if: >-
      ${{
        always() && (
          contains(join(needs.*.result, ','), 'failure')
          || !contains(join(needs.*.result, ','), 'cancelled')
        )
      }}
    steps:
      - name: Verify that there were no failures
        run: ${{ !contains(join(needs.*.result, ','), 'failure') }}
